<head>
    <title>Sign Up</title>
    <link rel="icon" type="image/x-icon" href="/media/BasFactor.png">
    <meta lang="en">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/kute.js@2.1.2/dist/kute.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <style>
        body {
            font-family: 'M PLUS 1 Code', sans-serif;
            background-image: url("media/bg_2.jpg");
            background-size: cover;
            margin: 0;
            overflow-x: hidden; /* no scrolling is possible */
            overflow-y: hidden;
        }

        .centerContainer {
            text-align: center;
        }

        #signUpWrap {
            border-radius: 10px;
        }
    </style>

</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <!--Navbar icon-->
            <a class="navbar-brand">
                <img src="/media/BasFactor.png" alt="BasFactor" width="30" height="30">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
                   
            <!-- Content that collapses -->
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="festivals/">Festivals</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="food/">Calendar</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <!--m-4 sets margin all around to 4, 
        p-3 sets padding all around to 3 
        col-sm-8 sets the width above the sm-breakpoint to 8 cols
        col-md-6 sets the width above the md-breakpoint to 6 cols
        mx-auto centers the form horizontally (sets margin to left and right to auto)
    
    the action value defines where the data is send, when the form is submitted-->
 
    <form method="post" id="signUpWrap" novalidate
    class="m-4 mx-auto p-3 bg-light col-sm-8 col-md-6 col-xl-4" >
        <div class="mb-3">
            <label for="signUpMail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="signUpMail" aria-describedby="emailHelp" name="signUpMail">
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please provide a mail.</div>                  
        </div>
        <div class="mb-3">
            <label for="signUpPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="signUpPassword" name="signUpPassword">
        </div>
        <div class="mb-3">
            <label for="signUpPasswordConfirmation" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="signUpPasswordConfirmation" name="signUpPasswordConfirmation">
        </div>
        <div class="mx-auto col-2 centerContainer">
            <a href="#" class="mx-auto">Log in</a>
            <button type="submit" class="btn btn-primary mt-2">Submit</button>
        </div>
    </form>

    <div id="responseContainer" class="bg-light"></div>
    
    <script>
        function submitForm() {
            // Get form data
            const formData = {
                email: document.getElementById('signUpMail').value,
                password: document.getElementById('signUpPassword').value
            };

            // Make a POST request to the /user/addUser endpoint
            fetch('/user/addUser', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Handle the response data as needed
                document.getElementById('responseContainer').innerText = JSON.stringify(data, null, 2);
                console.log(data);
            })
            .catch(error => {
                // Handle errors
                console.error('Error:', error);
            });
        }
    </script>
    
</body>
